<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>团队导航助手</title>
  <style>
    body {
      width: 320px;
      padding: 20px;
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }
    
    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      opacity: 0.8;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
    }
    
    .form-group input {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    
    .btn-primary:hover {
      background: #45a049;
    }
    
    .btn-secondary {
      background: #2196F3;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #1976D2;
    }
    
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
    }
    
    .status.success {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid #4CAF50;
    }
    
    .status.error {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid #F44336;
    }
    
    .tips {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 15px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>团队导航助手</h1>
    <p>快速添加网页到团队导航</p>
  </div>
  
  <div class="form-group">
    <label for="navServerUrl">导航服务器地址：</label>
    <input type="url" id="navServerUrl" placeholder="例如: http://localhost:8082" />
  </div>
  
  <button class="btn btn-primary" id="saveUrl">保存设置</button>
  <button class="btn btn-secondary" id="addCurrentPage">添加当前页面</button>
  
  <div id="status" class="status" style="display: none;"></div>
  
  <div class="tips">
    <strong>使用说明：</strong><br>
    1. 设置导航服务器地址<br>
    2. 右键点击任意网页，选择"添加到团队导航"<br>
    3. 或点击"添加当前页面"按钮<br>
    4. 在导航页面中完善信息并提交
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
