name: Java CI with Maven

on:
  push:
    branches: [ "main" ]  # 在推送到 main 分支时触发
  pull_request:
    branches: [ "main" ]   # 在 PR 到 main 分支时触发

jobs:
  build:
    runs-on: ubuntu-latest  # 使用最新 Ubuntu 环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v3  # 检出代码
    
    # 设置 JDK 8
    - name: Set up JDK 1.8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    
    # 设置 Node.js 20
    - name: Set up Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    # 安装全局 Vue CLI
    - name: Install Vue CLI globally
      run: npm install -g @vue/cli-service
    
    # 构建项目
    - name: Build with Maven
      run: mvn -B clean package -Dmaven.npm.skip=false
      env:
        CI: true  # 告诉前端工具这是 CI 环境
    
    # 上传构建产物
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: application-jar
        path: target/*.jar  # 上传所有生成的 JAR 文件
